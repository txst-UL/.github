name: 'Dependency Review'

on:
  pull_request:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 0-6'  # Saturday through Sunday at 12am UTC

permissions:
  contents: read
  issues: write
  pull-requests: write


jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure
          show-patched-versions: true
          warn-on-openssf-scorecard-level: 5
          vulnerability-check: true
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  create-issue:
    runs-on: ubuntu-latest
    needs: dependency-review
    if: failure()
    steps:
      - name: 'Create Issue for Vulnerability'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security: Vulnerabilities found in dependencies - ${new Date().toISOString().split('T')[0]}`,
              body: `## Dependency Vulnerability Alert\n\nThe scheduled dependency review found vulnerabilities.\n\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n**Action required:** Review and update affected dependencies.`,
              labels: ['security', 'dependencies']
            })
